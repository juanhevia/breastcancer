[tool.poetry]
name = "breastcancer"
version = "0.1.0"
description = "CNN docente desde cero para BreastDCEDL"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24,<2"
torch = "2.2.2"
pandas = ">=2,<3"
pillow = ">=10,<12"
scikit-learn = ">=1.3,<1.8"
matplotlib = ">=3.7,<3.11"
requests = ">=2.31,<3"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6,<1"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
